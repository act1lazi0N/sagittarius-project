syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.sagittarius.grpc.cart";
option java_outer_classname = "CartProto";

package cart;

service CartService {
  rpc GetCart (GetCartRequest) returns (CartResponse);
  rpc ClearCart (ClearCartRequest) returns (ClearCartResponse);
}

message GetCartRequest { string customer_id = 1; }
message ClearCartRequest { string customer_id = 1; }
message ClearCartResponse { bool success = 1; }

message CartItem {
  string product_id = 1;
  int32 quantity = 2;
  string price = 3;
}

message CartResponse {
  string customer_id = 1;
  repeated CartItem items = 2;
}