server:
  port: 8086

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/product_db?authSource=admin
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    uris: http://localhost:9200
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    cors:
      allowed-origins: "*"

grpc:
  server:
    port: 9090